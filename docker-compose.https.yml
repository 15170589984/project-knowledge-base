services:
  backend:
    environment:
      COOKIE_SECURE: "true"

  frontend:
    ports:
      - "443:443"
    volumes:
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
