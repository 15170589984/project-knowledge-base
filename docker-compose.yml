services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_PATH: /data/knowledge.db
      SEED_DEFAULT_CATEGORIES: "true"
    volumes:
      - ./data:/data
    expose:
      - "8000"
    networks:
      - knowledge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - knowledge
    restart: unless-stopped

networks:
  knowledge:
    driver: bridge
